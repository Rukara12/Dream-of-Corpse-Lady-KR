name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - 'tools/**'
      - 'README.md'
      - 'THIRD-PARTY.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r patcher/requirements.txt pyinstaller
      - name: 패처 빌드
        run: pyinstaller --noconfirm patcher/build.spec
      - name: 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: patcher
          path: dist/*.exe
      - name: latest 태그 이동
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git tag -f latest
          git push -f origin latest
      - name: latest 릴리스 갱신
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 최신 빌드
          body: DreamOfCorpseLady-KR-Patch.exe
          prerelease: true
          make_latest: false
          files: dist/*.exe
      - name: 버전 릴리스
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
